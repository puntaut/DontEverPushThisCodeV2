name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# TODO#0: Permissions block - Principle of Least Privilege
permissions:
  contents: read             # TODO#0a
  security-events: write     # TODO#0b
  pull-requests: write       # TODO#0c
  actions: read

jobs:
  # ==========================================
  # GATE#0: Secret Scanning
  # ==========================================
  secret-scan:
    name: "GATE#0 - Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # TODO#1: Full git history needed for secret scanners
          fetch-depth: 0

      # TODO#2 & TODO#3: TruffleHog (Scan commit diff & verify live creds)
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # TODO#4: Gitleaks step with SARIF upload and job summary
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  # ==========================================
  # GATE#1a: SonarCloud SAST
  # ==========================================
  sonarcloud:
    name: "GATE#1a - SonarCloud SAST"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # TODO#5: Full git history for blame detection
          fetch-depth: 0

      # TODO#6: SonarCloud Scan Step
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================
  # GATE#1b: CodeQL SAST
  # ==========================================
  codeql:
    name: "GATE#1b - CodeQL SAST"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO#7: CodeQL language for Next.js/React
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # TODO#8: Extended security and quality query suites
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          # TODO#9: Avoid collisions when scanning multiple languages
          category: "/language:${{ matrix.language }}"

  # ==========================================
  # GATE#2: Dependency Scanning (OWASP Dep-Check)
  # ==========================================
  dependency-check:
    name: "GATE#2 - Dependency Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO#10: Set up Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # TODO#11: Install dependencies before scanning
      - name: Install Dependencies
        run: npm install --package-lock-only

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: 'DontEverPushThisCodeV2'
          path: '.'
          # TODO#12: Format for GitHub Security tab integration
          format: 'SARIF'
          # TODO#13: Fail threshold separating MEDIUM from HIGH (CVSS >= 7.0)
          args: >
            --failOnCVSS 7
            --enableRetired

      # TODO#14: Upload SARIF report to GitHub Security tab
      - name: Upload Dependency-Check SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'reports/dependency-check-report.sarif'
          category: "/gate:dependency-check"

      # TODO#15: Upload raw report folder as downloadable workflow artifact
      - name: Upload Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: 'reports/'

  # ==========================================
  # GATE#3: Container Scanning (Trivy)
  # ==========================================
  container-scan:
    name: "GATE#3 - Trivy Container Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO#16: Build Docker image before scanning
      - name: Build Docker Image
        run: |
          docker build -t highly-exploitable-site .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'highly-exploitable-site'
          # TODO#17: SARIF output format
          format: 'sarif'
          output: 'trivy-results.sarif'
          # TODO#18: Severity levels to report
          severity: 'CRITICAL,HIGH'
          # TODO#19: Report only CVEs with available fixes
          ignore-unfixed: true

      # TODO#20: Upload Trivy SARIF to GitHub Security tab
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: "/gate:trivy-container"

      # TODO#21: Upload raw SARIF as a downloadable artifact
      - name: Upload Trivy Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-results
          path: 'trivy-results.sarif'
